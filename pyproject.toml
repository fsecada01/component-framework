[project]
name = "component-framework"
version = "0.1.0"
description = "Framework-agnostic server components with LiveView-style interactivity"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["components", "server-components", "liveview", "htmx", "fastapi", "django"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "jinjax>=0.41",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-django>=4.5.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
]
django = [
    "django>=4.2",
    "django-cotton>=0.9",
    "channels>=4.0",
    "channels-redis>=4.1",
]
websockets = [
    "websockets>=12.0",
]

[project.urls]
Homepage = "https://github.com/fsecada01/component-framework"
Documentation = "https://github.com/fsecada01/component-framework#readme"
Repository = "https://github.com/fsecada01/component-framework"
Issues = "https://github.com/fsecada01/component-framework/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/component_framework"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
