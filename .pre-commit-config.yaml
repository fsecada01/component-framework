repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ty does not have an official pre-commit mirror yet (astral-sh/ty#269).
  # Use a local hook until one is available.
  - repo: local
    hooks:
      - id: ty
        name: ty type check
        entry: ty check src/
        language: system
        pass_filenames: false
        always_run: true
        types: [python]
