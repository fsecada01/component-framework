name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        # Brings ruff, the pinned ty, and prek (plus the framework deps ty needs
        # to resolve imports) so the hooks run against a complete environment.
        run: pip install -e ".[dev]"
      - name: Run lint hooks (prek)
        # Single source of truth: CI runs the same pinned hooks as local
        # pre-commit (ruff, ruff-format, ty) defined in .pre-commit-config.yaml.
        run: prek run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -q --tb=short

  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run client-side JS tests
        run: node --test "tests/js/**/*.test.mjs"
