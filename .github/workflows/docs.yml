name: Docs

# Deploy API documentation to GitHub Pages.
#
# Versioning strategy
# ───────────────────
# • Push to master  → docs deployed to  gh-pages:/main/
# • Push of v* tag  → docs deployed to  gh-pages:/{tag}/   (e.g. /v0.1.0/)
#                     AND the symlink    gh-pages:/latest/  is updated
# • Older versions are never touched — their directories remain on the branch.
# • Root gh-pages/index.html lists all available versions.
# • Each page contains a version-switcher (fetches /versions.json at runtime).

on:
  push:
    branches: [master, main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version_override:
        description: "Version label to deploy as (leave blank to use branch/tag)"
        required: false
        default: ""

permissions:
  contents: write    # needed to push to gh-pages branch

concurrency:
  group: docs-deploy
  cancel-in-progress: false   # never cancel a running deploy mid-flight

jobs:
  build-and-deploy:
    name: Build & Deploy Docs
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout source ─────────────────────────────────────────────
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so git-describe works

      # ── 2. Python + pdoc ──────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pdoc and project
        run: |
          pip install pdoc
          pip install -e ".[dev,django,websockets]"

      # ── 3. Determine the version label ────────────────────────────────
      - name: Determine version label
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version_override }}" ]; then
            LABEL="${{ github.event.inputs.version_override }}"
            IS_RELEASE="false"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            LABEL="${GITHUB_REF#refs/tags/}"   # e.g. "v0.1.0"
            IS_RELEASE="true"
          else
            LABEL="main"
            IS_RELEASE="false"
          fi
          echo "label=${LABEL}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Deploying docs as version: ${LABEL} (is_release=${IS_RELEASE})"

      # ── 4. Generate API docs with pdoc ────────────────────────────────
      # make.py uses pdoc's Python API (not the CLI) so that Django can
      # be initialised before the package is imported.  Output goes to
      # generated/component_framework/.
      - name: Generate docs
        run: python docs/make.py --output-dir generated

      # ── 5. Prepare gh-pages working tree ──────────────────────────────
      #
      # We use a git worktree so we can work on the gh-pages branch in a
      # subdirectory while staying on the main branch in the repo root.
      # If the gh-pages branch does not yet exist we initialise it as an
      # orphan branch with a bare commit so the worktree add succeeds.
      - name: Prepare gh-pages worktree
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch gh-pages if it already exists on origin
          git fetch origin gh-pages:gh-pages 2>/dev/null || true

          if git show-ref --quiet refs/heads/gh-pages; then
            # Branch exists locally → add as worktree
            git worktree add gh-pages-dir gh-pages
          else
            # Branch does not exist yet → create orphan
            git worktree add --orphan -b gh-pages gh-pages-dir
            # Commit a placeholder so the branch is not empty
            cd gh-pages-dir
            cat > index.html <<'HTML'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"><title>component-framework docs</title></head>
          <body><p>Documentation is being generated…</p></body></html>
          HTML
            git add index.html
            git commit -m "chore: initialise gh-pages branch"
            cd ..
          fi

      # ── 6. Copy generated docs into the version subfolder ─────────────
      - name: Copy docs to version directory
        run: |
          LABEL="${{ steps.version.outputs.label }}"
          DEST="gh-pages-dir/${LABEL}"

          # Remove stale version directory so old removed modules don't linger
          rm -rf "${DEST}"
          mkdir -p "${DEST}"

          # pdoc output is generated/component_framework/
          cp -r generated/component_framework "${DEST}/"

      # ── 7. Update latest/ symlink for release tags ────────────────────
      - name: Update latest symlink (releases only)
        if: steps.version.outputs.is_release == 'true'
        run: |
          LABEL="${{ steps.version.outputs.label }}"
          cd gh-pages-dir
          # Remove existing symlink or directory
          rm -rf latest
          ln -s "${LABEL}" latest

      # ── 8. Regenerate versions.json and root index ────────────────────
      - name: Update versions.json and root index.html
        run: |
          python docs/update_gh_pages.py --pages-dir gh-pages-dir

      # ── 9. Commit and push gh-pages ───────────────────────────────────
      - name: Commit and push
        run: |
          LABEL="${{ steps.version.outputs.label }}"
          COMMIT_SHA="${GITHUB_SHA:0:7}"

          cd gh-pages-dir
          git add -A

          # Only commit if there are actual changes
          if git diff --cached --quiet; then
            echo "No changes to commit — docs are already up to date."
          else
            git commit -m "docs: deploy ${LABEL} (${COMMIT_SHA})"
            git push origin gh-pages
            echo "Docs deployed to gh-pages/${LABEL}/"
          fi
